<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Ghassan 🤍</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Georgia,serif;
    background:linear-gradient(135deg,#f7f1e8,#fff,#ead8b5);
    min-height:100vh;
    overflow:hidden;
}

/* Loading Screen */

#loading{
    position:fixed;
    inset:0;
    background:#f7efe3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
    animation:fadeOut 1s ease 2.5s forwards;
}

.loading-text{
    font-size:28px;
    color:#8b6b3f;
    margin-bottom:30px;
}

.heart{
    position:absolute;
    color:#c49a6c;
    font-size:25px;
    animation:float 3s infinite ease-in;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-20vh);
        opacity:0;
    }
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}


/* Main */

.container{
    text-align:center;
    padding:40px 20px;
}

h1{
    color:#6f5232;
    margin-top:80px;
    font-size:32px;
}

p{
    color:#8b6b3f;
    font-size:18px;
}

button{
    background:#b08b57;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin-top:30px;
    box-shadow:0 5px 15px #cbb28a;
}

button:hover{
    transform:scale(1.05);
}


/* Envelopes */

#letters{
    display:none;
    margin-top:40px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
}

.envelope{
    width:130px;
    height:100px;
    background:linear-gradient(#d4af6a,#b8873b);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:40px;
    cursor:pointer;
    transition:.5s;
    box-shadow:0 8px 20px #c8a46b;
}

.envelope:hover{
    transform:translateY(-10px) rotate(3deg);
}


/* Message */

.message-box{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    width:85%;
    max-width:400px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px #bca47d;
    color:#6f5232;
    font-size:20px;
    animation:open .5s;
}

@keyframes open{
    from{
        transform:translate(-50%,-50%) scale(0);
    }
    to{
        transform:translate(-50%,-50%) scale(1);
    }
}

.close{
    margin-top:20px;
    background:#b08b57;
}
</style>

</head>

<body>


<div id="loading">

<div class="loading-text">
Loading Memories... 🤍
</div>

<div class="heart" style="left:20%;">🤍</div>
<div class="heart" style="left:40%;animation-delay:1s;">♡</div>
<div class="heart" style="left:70%;animation-delay:.5s;">🤍</div>

</div>



<div class="container">

<h1>
A Gift Made With Love For Ghassan 🤍
</h1>

<p>
Every little thing here was made with love.
</p>


<button onclick="openHeart()">
❤️ Open My Heart
</button>


<div id="letters">

<div class="envelope" onclick="showMessage(1)">💌</div>
<div class="envelope" onclick="showMessage(2)">💌</div>
<div class="envelope" onclick="showMessage(3)">💌</div>
<div class="envelope" onclick="showMessage(4)">💌</div>
<div class="envelope" onclick="showMessage(5)">💌</div>
<div class="envelope" onclick="showMessage(6)">💌</div>

</div>


</div>



<div class="message-box" id="message">

<div id="text"></div>

<button class="close" onclick="closeMessage()">
Close 🤍
</button>

</div>




<script>

function openHeart(){

document.getElementById("letters").style.display="flex";

}


let messages={

1:"غسان 🤍 وجودك بحياتي من أجمل الأشياء اللي صارت معي.",

2:"أحب فيك اهتمامك وتعبك ومحاولاتك حتى لو كانت صغيرة.",

3:"هذه الرسالة تذكير إن في شخص يدعي لك ويتمنى لك الخير دائمًا 🤍",

4:"كل لحظة بيننا لها مكان خاص بقلبي.",

5:"أتمنى ربنا يجمعنا على خير ويكتب لنا أيام أجمل.",

6:"هذه مجرد بداية... باقي المفاجآت لسه جاية 🤍✨"

};


function showMessage(num){

document.getElementById("text").innerHTML=messages[num];

document.getElementById("message").style.display="block";

}


function closeMessage(){

document.getElementById("message").style.display="none";

}

</script>


</body>
</html>
