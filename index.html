<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ghassan 🤍</title>

<style>
body{
margin:0;
font-family:Georgia,serif;
background:linear-gradient(135deg,#f7f1e8,#ffffff,#efe2c6);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:white;
padding:40px;
border-radius:25px;
text-align:center;
max-width:500px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
color:#c49b2a;
}

p{
color:#666;
line-height:1.8;
}

button{
background:#c49b2a;
color:white;
padding:15px 30px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#b3871d;
}
</style>

</head>

<body>

<div class="box">

<h1>For Ghassan 🤍</h1>
<h3 style="color:#b08d57;">
Made with Love, Just for You
</h3>

<p>
Every memory in this little place was made especially for you.

Each envelope hides a message, a memory, or a reason why I love you.

Open them one by one... 🤍
</p>

<button>
Open My Heart ❤️
</button>

</div>

</body>
</html>
