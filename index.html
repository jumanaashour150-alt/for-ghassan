<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Ghassan 🤍</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Georgia,serif;
background:linear-gradient(135deg,#f8efe3,#fff,#e8d0a0);
min-height:100vh;
color:#6d4b28;
overflow-x:hidden;
}


/* Loading */

#loading{
position:fixed;
inset:0;
background:#f8efe3;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:20;
animation:loadingEnd 3s forwards;
}

#loading h2{
font-size:28px;
}

@keyframes loadingEnd{
0%{
opacity:1;
}
80%{
opacity:1;
}
100%{
opacity:0;
visibility:hidden;
}
}


.heart{
position:absolute;
font-size:25px;
animation:heartMove 5s infinite;
}

@keyframes heartMove{

0%{
transform:translateY(100vh);
opacity:0;
}

50%{
opacity:1;
}

100%{
transform:translateY(-20vh);
opacity:0;
}

}


/* Main */

.container{
text-align:center;
padding:30px 15px;
}


h1{
margin-top:60px;
font-size:34px;
}


.subtitle{
font-size:18px;
}



button{

background:#b28a52;
color:white;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:17px;
cursor:pointer;
box-shadow:0 5px 15px #cdb58b;

}



/* Counter */

#counter{

font-size:20px;
margin:20px;

}



/* Envelopes */

#letters{

display:none;

justify-content:center;
flex-wrap:wrap;

gap:18px;

max-width:900px;

margin:auto;

}


.envelope{

width:95px;
height:75px;

background:linear-gradient(#e6c27c,#ad7b32);

border-radius:12px;

display:flex;

align-items:center;
justify-content:center;

font-size:35px;

cursor:pointer;

transition:.4s;

box-shadow:0 8px 20px #c9aa72;

}


.envelope:hover{

transform:translateY(-10px) scale(1.05);

}



/* Message */

#messageBox{

display:none;

position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:85%;

max-width:450px;

background:white;

padding:30px;

border-radius:25px;

font-size:21px;

line-height:1.8;

text-align:center;

box-shadow:0 10px 40px #b99b6b;

animation:openMessage .5s;

z-index:30;

}



@keyframes openMessage{

from{

transform:translate(-50%,-50%) scale(0);

}

to{

transform:translate(-50%,-50%) scale(1);

}

}



.smallHeart{

position:fixed;

font-size:25px;

animation:pop 1s forwards;

z-index:40;

}


@keyframes pop{

from{

transform:scale(0);

opacity:1;

}

to{

transform:translateY(-100px) scale(1.5);

opacity:0;

}

}


</style>

</head>


<body>


<div id="loading">

<h2>Loading Memories... 🤍</h2>

<div class="heart" style="left:20%">🤍</div>
<div class="heart" style="left:50%">♡</div>
<div class="heart" style="left:80%">🤍</div>

</div>



<div class="container">


<h1>
A Gift Made With Love For Ghassan 🤍
</h1>


<p class="subtitle">
30 little messages from my heart 💌
</p>


<button onclick="showLetters()">
❤️ Open My Heart
</button>


<div id="counter">
Opened: 0 / 30
</div>


<div id="letters">

<!-- 30 Envelopes -->

<div class="envelope" onclick="openMessage(1)">💌</div>
<div class="envelope" onclick="openMessage(2)">💌</div>
<div class="envelope" onclick="openMessage(3)">💌</div>
<div class="envelope" onclick="openMessage(4)">💌</div>
<div class="envelope" onclick="openMessage(5)">💌</div>
<div class="envelope" onclick="openMessage(6)">💌</div>
<div class="envelope" onclick="openMessage(7)">💌</div>
<div class="envelope" onclick="openMessage(8)">💌</div>
<div class="envelope" onclick="openMessage(9)">💌</div>
<div class="envelope" onclick="openMessage(10)">💌</div>
<div class="envelope" onclick="openMessage(11)">💌</div>
<div class="envelope" onclick="openMessage(12)">💌</div>
<div class="envelope" onclick="openMessage(13)">💌</div>
<div class="envelope" onclick="openMessage(14)">💌</div>
<div class="envelope" onclick="openMessage(15)">💌</div>
<div class="envelope" onclick="openMessage(16)">💌</div>
<div class="envelope" onclick="openMessage(17)">💌</div>
<div class="envelope" onclick="openMessage(18)">💌</div>
<div class="envelope" onclick="openMessage(19)">💌</div>
<div class="envelope" onclick="openMessage(20)">💌</div>
<div class="envelope" onclick="openMessage(21)">💌</div>
<div class="envelope" onclick="openMessage(22)">💌</div>
<div class="envelope" onclick="openMessage(23)">💌</div>
<div class="envelope" onclick="openMessage(24)">💌</div>
<div class="envelope" onclick="openMessage(25)">💌</div>
<div class="envelope" onclick="openMessage(26)">💌</div>
<div class="envelope" onclick="openMessage(27)">💌</div>
<div class="envelope" onclick="openMessage(28)">💌</div>
<div class="envelope" onclick="openMessage(29)">💌</div>
<div class="envelope" onclick="openMessage(30)">💌</div>

</div>

</div>



<div id="messageBox">

<div id="messageText"></div>

<button onclick="closeMessage()">
Close 🤍
</button>

</div>



<script>

let opened=[];


let messages={

1:"بحبك كتييير 🤍",

2:"بموت فيك 🤍",

3:"الله يخليلي إياك يا روح الروح 🤍",

4:"كل عام وأنت الخير يا روحي 🤍",

5:"كل عام وأنت حبي وحياتي 🤍",

6:"حبيب قلبي والله بحبك كتير 🤍",

7:"ربنا يسعدلي قلبك يا روحي 🤍",

8:"كل عام وأنت سعادتي 🤍",

9:"كل عام وأنت حبيب الروح 🤍",

10:"كل عام وأنت أجمل هدية بحياتي 🤍",

11:"بحبك كتير 🤍",

12:"بحبك كل يوم 🤍",

13:"وجودك بحياتي نعمة كبيرة 🤍",

14:"ضحكتك من الأشياء اللي بتفرح قلبي 🤍",

15:"بحب تفاصيلك الصغيرة وكل شيء فيك 🤍",

16:"أنت الشخص اللي دايمًا بدعي ربنا يحفظه إلي 🤍",

17:"معك بحس بالأمان والراحة 🤍",

18:"بحب كل لحظة حلوة جمعتنا 🤍",

19:"يا رب أشوفك دايمًا مبسوط وفرحان 🤍",

20:"الله يجمعنا على خير ويكتب لنا أجمل الأيام 🤍",

21:"رح أضل أختارك كل يوم 🤍",

22:"بتمنى نعيش أيام مليانة حب وفرح سوا 🤍",

23:"أنت جزء من أحلامي الجميلة 🤍",

24:"وجودك فرق بحياتي بطريقة ما بتنحكى 🤍",

25:"ربي يحميك ويخليك إلي 🤍",

26:"أنا فخورة فيك وبكل تعبك 🤍",

27:"قلبي اختارك من بين الكل 🤍",

28:"شكرًا لأنك أنت 🤍",

29:"آخر ظرف... بس حبي إلك ما إله آخر 🤍",

30:
"غسان 🤍\n\nإذا وصلت لهالرسالة يعني إنك فتحت كل جزء صغير من قلبي.\n\nكل ظرف كان فيه كلمة، بس الحقيقة إن كل الكلمات ما بتكفي توصف قديش إلك مكانة كبيرة عندي.\n\nبحبك مش بس بالأيام الحلوة، بحبك بكل التفاصيل وبكل اللحظات اللي جمعتنا.\n\nبدعي ربنا يحفظك ويسعد قلبك ويكتب لنا الخير وين ما كان.\n\nبتمنى أشوفك دايمًا مبسوط، وأكون سبب من أسباب فرحتك زي ما أنت سبب من أسباب فرحتي.\n\nشكرًا لأنك أنت... وبحبك اليوم وبكرة وكل يوم 🤍"

};



function showLetters(){

document.getElementById("letters").style.display="flex";

}



function openMessage(number){

document.getElementById("messageText").innerHTML=
messages[number].replace(/\n/g,"<br>");

document.getElementById("messageBox").style.display="block";


if(!opened.includes(number)){

opened.push(number);

document.getElementById("counter").innerHTML=
"Opened: "+opened.length+" / 30";

}


createHeart();

}



function closeMessage(){

document.getElementById("messageBox").style.display="none";

}



function createHeart(){

let heart=document.createElement("div");

heart.className="smallHeart";

heart.innerHTML="🤍";

heart.style.left=Math.random()*80+"%";

heart.style.top="70%";

document.body.appendChild(heart);


setTimeout(()=>{

heart.remove();

},1000);

}


</script>


</body>
</html>
