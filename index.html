<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Ghassan 🤍</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Georgia,serif;
background:linear-gradient(135deg,#f8efe3,#fff,#ead7b0);
min-height:100vh;
color:#76552d;
overflow-x:hidden;
}


/* Loading */

#loading{
position:fixed;
inset:0;
background:#f8efe3;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
animation:hide 2.5s forwards;
}

#loading h2{
font-size:28px;
}

@keyframes hide{
to{
opacity:0;
visibility:hidden;
}
}


.heart{
position:absolute;
font-size:25px;
animation:up 4s infinite;
}

@keyframes up{
from{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
to{
transform:translateY(-20vh);
opacity:0;
}
}


/* Home */

.container{
text-align:center;
padding:30px 15px;
}

h1{
margin-top:70px;
font-size:32px;
}

p{
font-size:18px;
}


button{
background:#b18a52;
border:none;
padding:14px 28px;
border-radius:30px;
color:white;
font-size:17px;
cursor:pointer;
margin:20px;
}


/* Counter */

#counter{
font-size:20px;
margin-top:20px;
}


/* Envelopes */

#letters{

display:none;

justify-content:center;
flex-wrap:wrap;
gap:20px;

margin-top:30px;

}


.envelope{

width:120px;
height:90px;

background:linear-gradient(#e2bd79,#ad7c32);

border-radius:12px;

display:flex;
justify-content:center;
align-items:center;

font-size:40px;

cursor:pointer;

box-shadow:0 8px 18px #c7a56d;

transition:.4s;

}


.envelope:hover{

transform:translateY(-8px) rotate(5deg);

}


/* Message */

#messageBox{

display:none;

position:fixed;

top:50%;
left:50%;

transform:translate(-50%,-50%);

width:85%;
max-width:400px;

background:white;

padding:30px;

border-radius:25px;

text-align:center;

font-size:22px;

box-shadow:0 10px 35px #b99b6b;

animation:open .5s;

}


@keyframes open{

from{

transform:translate(-50%,-50%) scale(0);

}

to{

transform:translate(-50%,-50%) scale(1);

}

}


</style>

</head>


<body>


<div id="loading">

<h2>Loading Memories... 🤍</h2>

<div class="heart" style="left:20%">🤍</div>
<div class="heart" style="left:50%;animation-delay:1s">♡</div>
<div class="heart" style="left:80%;animation-delay:2s">🤍</div>

</div>



<div class="container">


<h1>
A Gift Made With Love For Ghassan 🤍
</h1>


<p>
Every letter has a piece of my heart.
</p>


<button onclick="openLetters()">
❤️ Open My Heart
</button>


<div id="counter">
Opened: 0 / 12
</div>



<div id="letters">


<div class="envelope" onclick="openMessage(1)">💌</div>
<div class="envelope" onclick="openMessage(2)">💌</div>
<div class="envelope" onclick="openMessage(3)">💌</div>
<div class="envelope" onclick="openMessage(4)">💌</div>
<div class="envelope" onclick="openMessage(5)">💌</div>
<div class="envelope" onclick="openMessage(6)">💌</div>
<div class="envelope" onclick="openMessage(7)">💌</div>
<div class="envelope" onclick="openMessage(8)">💌</div>
<div class="envelope" onclick="openMessage(9)">💌</div>
<div class="envelope" onclick="openMessage(10)">💌</div>
<div class="envelope" onclick="openMessage(11)">💌</div>
<div class="envelope" onclick="openMessage(12)">💌</div>


</div>


</div>



<div id="messageBox">

<div id="messageText"></div>

<button onclick="closeMessage()">
Close 🤍
</button>

</div>




<script>


let opened=[];


let messages={

1:"بحبك كتييير 🤍",

2:"بموت فيك 🤍",

3:"الله يخليلي إياك يا روح الروح 🤍",

4:"كل عام وأنت الخير يا روحي 🤍",

5:"كل عام وأنت حبي وحياتي 🤍",

6:"حبيب قلبي والله بحبك كتير 🤍",

7:"ربنا يسعدلي قلبك يا روحي 🤍",

8:"كل عام وأنت سعادتي 🤍",

9:"كل عام وأنت حبيب الروح 🤍",

10:"كل عام وأنت أجمل هدية بحياتي 🤍",

11:"بحبك كتير 🤍",

12:"بحبك كل يوم 🤍"

};



function openLetters(){

document.getElementById("letters").style.display="flex";

}



function openMessage(number){


document.getElementById("messageText").innerHTML=
messages[number];


document.getElementById("messageBox").style.display="block";



if(!opened.includes(number)){

opened.push(number);

document.getElementById("counter").innerHTML=
"Opened: "+opened.length+" / 12";

}



}



function closeMessage(){

document.getElementById("messageBox").style.display="none";

}


</script>


</body>

</html>
