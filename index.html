<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ghassan 🤍</title>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:linear-gradient(135deg,#f7f1e8,#ffffff,#efe2c6);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:white;
    padding:40px;
    border-radius:25px;
    text-align:center;
    max-width:600px;
    width:90%;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    color:#c49b2a;
}

h3{
    color:#b08d57;
}

p{
    color:#666;
    line-height:1.8;
}

button{
    background:#c49b2a;
    color:white;
    padding:15px 30px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#b3871d;
}

#envelopes{
    display:none;
    margin-top:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.envelope{
    background:#d4af37;
    color:white;
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    font-size:40px;
    transition:.3s;
}

.envelope:hover{
    transform:scale(1.05);
}

#message{
    margin-top:30px;
    background:#faf7ef;
    border-radius:15px;
    padding:20px;
}

</style>

</head>

<body>

<div class="box">

<h1>For Ghassan 🤍</h1>

<h3>Made with Love, Just for You</h3>

<p>
Every memory in this little place was made especially for you.
<br><br>
Each envelope hides a message, a memory, or a reason why I love you.
<br><br>
Open them one by one... 🤍
</p>

<button onclick="showEnvelopes()">
Open My Heart ❤️
</button>

<div id="envelopes">

<div class="grid">

<div class="envelope" onclick="openMessage(1)">
💌
<br>
<span style="font-size:16px;">Envelope 1</span>
</div>

<div class="envelope" onclick="openMessage(2)">
💌
<br>
<span style="font-size:16px;">Envelope 2</span>
</div>

</div>

<div id="message"></div>

</div>

</div>

<script>

function showEnvelopes(){
    document.getElementById("envelopes").style.display="block";
}

function openMessage(n){

    if(n==1){
        document.getElementById("message").innerHTML=
        "<h2>🤍 The Beginning</h2><p>Dear Ghassan,<br><br>This website was made especially for you. Every envelope will remind you how much you mean to me. ❤️</p>";
    }

    if(n==2){
        document.getElementById("message").innerHTML=
        "<h2>🌸 A Little Note</h2><p>Thank you for being part of my life. I hope every click here makes you smile. 🤍</p>";
    }

}

</script>

</body>
</html>
