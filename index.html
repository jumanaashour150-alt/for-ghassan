<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 Letters To You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf9f5;
  --bg-card:#ffffff;
  --border:#e2d9cd;
  --text:#2c2825;
  --text-muted:#8c827a;
  --accent:#c49a45;
  --accent-light:#f4eedb;
  --accent-dark:#8c6d2d;
  --envelope-bg:#f5eedc;
  --envelope-bg-open:#faf6ee;
  --wax:#a24b4b;
  --shadow:0 8px 30px rgba(0,0,0,.04);
  --shadow-hover:0 15px 35px rgba(162,123,67,.12);
  --radius:16px;
  --transition:all .4s cubic-bezier(.25,1,.5,1)
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Montserrat',sans-serif;
  background-color:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:2rem 1rem 4rem;
  background-image:radial-gradient(#e8dfd1 1px,transparent 1px);
  background-size:24px 24px
}
header{
  text-align:center;
  max-width:600px;
  margin-bottom:2rem;
  animation:fadeInDown .8s ease-out
}
h1{
  font-family:'Cormorant Garamond',serif;
  font-size:2.8rem;
  font-weight:400;
  letter-spacing:1px;
  color:#1a1817;
  margin-bottom:.5rem
}
header p{
  font-size:.9rem;
  color:var(--text-muted);
  font-weight:300;
  letter-spacing:.5px
}
.progress-container{
  width:100%;
  max-width:400px;
  background:#ede6da;
  height:6px;
  border-radius:10px;
  margin:1.5rem auto 0;
  overflow:hidden;
  position:relative
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent-dark));
  width:0%;
  border-radius:10px;
  transition:width .5s ease
}
.progress-text{
  font-size:.75rem;
  color:var(--accent-dark);
  margin-top:.4rem;
  font-weight:500;
  letter-spacing:1px
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:1.2rem;
  width:100%;
  max-width:900px;
  padding:.5rem
}
.envelope-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1.2rem 1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  position:relative;
  transition:var(--transition);
  box-shadow:var(--shadow);
  aspect-ratio:4/5;
  user-select:none
}
.envelope-card:hover{
  transform:translateY(-5px);
  border-color:var(--accent);
  box-shadow:var(--shadow-hover)
}
.envelope-card.opened{
  background:var(--envelope-bg-open);
  border-color:#dcd2c4
}
.card-num{
  font-family:'Cormorant Garamond',serif;
  font-size:1.2rem;
  font-weight:600;
  color:var(--text-muted);
  position:absolute;
  top:10px;
  left:14px
}
.opened .card-num{
  color:var(--accent)
}
.env-icon{
  width:44px;
  height:44px;
  margin-top:auto;
  margin-bottom:auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center
}
.env-icon svg{
  width:100%;
  height:100%;
  fill:none;
  stroke:var(--accent);
  stroke-width:1.5;
  transition:var(--transition)
}
.opened .env-icon svg{
  stroke:var(--text-muted)
}
.wax-seal{
  width:14px;
  height:14px;
  background:var(--wax);
  border-radius:50%;
  position:absolute;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition)
}
.wax-seal::after{
  content:'♥';
  color:#fff;
  font-size:7px
}
.opened .wax-seal{
  opacity:0;
  transform:scale(.5)
}
.card-label{
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--text-muted);
  font-weight:500
}
.opened .card-label{
  color:#a0958b
}
.modal-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(26,24,23,.4);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease
}
.modal-overlay.active{
  opacity:1;
  pointer-events:all
}
.modal{
  background:var(--bg-card);
  border-radius:20px;
  width:100%;
  max-width:550px;
  max-height:85vh;
  display:flex;
  flex-direction:column;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  transform:scale(.95) translateY(10px);
  transition:transform .3s ease;
  border:1px solid var(--border);
  overflow:hidden
}
.modal-overlay.active .modal{
  transform:scale(1) translateY(0)
}
.modal-header{
  padding:1.2rem 1.5rem;
  border-bottom:1px solid #f0e9df;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#faf7f2
}
.modal-header h2{
  font-family:'Cormorant Garamond',serif;
  font-size:1.5rem;
  color:var(--accent-dark);
  font-weight:600
}
.close-btn{
  background:none;
  border:none;
  font-size:1.5rem;
  color:var(--text-muted);
  cursor:pointer;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:var(--transition)
}
.close-btn:hover{
  background:#ebdcc6;
  color:var(--text)
}
.modal-body{
  padding:1.8rem 1.5rem;
  overflow-y:auto;
  font-family:'Cormorant Garamond',serif;
  font-size:1.25rem;
  line-height:1.8;
  color:#3a3532
}
.modal-body img{
  max-width:100%;
  height:auto;
  border-radius:12px;
  margin-top:1rem;
  display:block
}
.modal-footer{
  padding:1rem 1.5rem;
  border-top:1px solid #f0e9df;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#faf7f2
}
.nav-btn{
  background:none;
  border:1px solid var(--border);
  padding:.4rem .8rem;
  border-radius:8px;
  font-size:.8rem;
  cursor:pointer;
  color:var(--text);
  transition:var(--transition);
  font-family:'Montserrat',sans-serif
}
.nav-btn:hover:not(:disabled){
  border-color:var(--accent);
  color:var(--accent-dark)
}
.nav-btn:disabled{
  opacity:.3;
  cursor:not-allowed
}
@keyframes fadeInDown{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<header>
  <h1>30 Letters To You</h1>
  <p>A daily note for your 30s. Open one each day.</p>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-text" id="progressText">0 / 30 Opened</div>
</header>

<div class="grid" id="lettersGrid"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Letter #1</h2>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    <div class="modal-body" id="messageBody"></div>
    <div class="modal-footer">
      <button class="nav-btn" id="prevBtn">← Previous</button>
      <button class="nav-btn" id="nextBtn">Next →</button>
    </div>
  </div>
</div>

<script>
const messages = {
  1: "<img src='photo1.jpg' alt='Photo 1'><br>Happy Birthday to my favorite person. Entering your 30s is a big step, but you are doing it with so much grace. I hope this month feels special and gentle for you.",
  2: "<img src='photo2.jpg' alt='Photo 2'><br>I hope today is light on your heart. Whenever things feel heavy, remember to take a deep breath. You are handling everything so much better than you give yourself credit for.",
  3: "<img src='photo3.jpg' alt='Photo 3'><br>Just a small reminder: I really admire your mind and how you think about things. Never stop being as curious and thoughtful as you are.",
  4: "<img src='photo4.jpg' alt='Photo 4'><br>Life moves fast, but I hope today you find a small moment just for yourself. Drink your coffee slowly, listen to a song you like, and just be.",
  5: "<img src='photo5.jpg' alt='Photo 5'><br>You have this quiet strength that inspires me. Even when you’re tired or unsure, you keep going. I see it, and I appreciate it.",
  6: "<img src='photo6.jpg' alt='Photo 6'><br>I hope someone made you smile today. If not, let this be your reason. You deserve a day that feels easy.",
  7: "<img src='photo7.jpg' alt='Photo 7'><br>One week into 30! I hope you're realizing that nothing magically breaks at 30—you’re just getting wiser, cooler, and better at being yourself.",
  8: "<img src='photo8.jpg' alt='Photo 8'><br>Thank you for all the little moments we share that probably mean more to me than you know. Being around you is always a highlight.",
  9: "<img src='photo9.jpg' alt='Photo 9'><br>Don't rush yourself today. Everything will get done in its time. Give yourself the same patience you give to everyone else.",
  10: "<img src='photo10.jpg' alt='Photo 10'><br>Double digits! I hope you know how much light you bring into the spaces you walk into. You have a very gentle, comforting presence.",
  11: "<img src='photo11.jpg' alt='Photo 11'><br>If today feels overwhelming, break it down into small steps. One hour at a time. You've got this, like you always do.",
  12: "<img src='photo12.jpg' alt='Photo 12'><br>I hope you’re eating well and resting enough. Taking care of yourself is the most important thing on your to-do list.",
  13: "<img src='photo13.jpg' alt='Photo 13'><br>Almost halfway through the month. I hope you've been feeling loved and appreciated, because you really are.",
  14: "<img src='photo14.jpg' alt='Photo 14'><br>A reminder that it’s completely okay not to have everything figured out. No one really does. You are doing just fine.",
  15: "<img src='photo15.jpg' alt='Photo 15'><br>Halfway mark! 15 days of 30. Look back at how far you’ve come and be proud of the person you’ve built yourself to be.",
  16: "<img src='photo16.jpg' alt='Photo 16'><br>I hope today brings you a peaceful moment, good news, or just a really good laugh.",
  17: "<img src='photo17.jpg' alt='Photo 17'><br>Your kindness is one of my favorite things about you. Never let the coldness of the world change that soft heart of yours.",
  18: "<img src='photo18.jpg' alt='Photo 18'><br>Whatever you’re working on or hoping for right now, I’m quietly rooting for you. Always.",
  19: "<img src='photo19.jpg' alt='Photo 19'><br>Make sure to do something today purely because it makes you happy. No productivity, no goals—just joy.",
  20: "<img src='photo20.jpg' alt='Photo 20'><br>20 days in! I hope this new chapter feels less scary and more like an exciting blank page.",
  21: "<img src='photo21.jpg' alt='Photo 21'><br>Thank you for being someone I can trust and rely on. Your presence in my life means more than words can say.",
  22: "<img src='photo22.jpg' alt='Photo 22'><br>Don’t compare your pace to anyone else’s. You are on your own timeline, and it’s unfolding exactly as it should.",
  23: "<img src='photo23.jpg' alt='Photo 23'><br>I hope you take a second today to appreciate yourself—your resilience, your sense of humor, and your warm heart.",
  24: "<img src='photo24.jpg' alt='Photo 24'><br>Sending you a soft, quiet hug through this note. I hope today treats you gently.",
  25: "<img src='photo25.jpg' alt='Photo 25'><br>Only 5 letters left! I hope this little daily ritual has brought a bit of warmth to your month.",
  26: "<img src='photo26.jpg' alt='Photo 26'><br>Never forget that you are worthy of all the good things coming your way. Don't shrink yourself for anyone.",
  27: "<img src='photo27.jpg' alt='Photo 27'><br>I hope you get a great night's sleep tonight and wake up feeling refreshed and ready for tomorrow.",
  28: "<img src='photo28.jpg' alt='Photo 28'><br>You bring so much quiet joy to those around you. I hope you feel that same joy returned to you today.",
  29: "<img src='photo29.jpg' alt='Photo 29'><br>Penultimate letter! Tomorrow is the last one, but my support and care for you don't end with this grid.",
  30: "<img src='photo30.jpg' alt='Photo 30'><br>The final letter. 30 notes for 30 days. Welcome officially to your 30s. I’m so lucky to witness your journey. Here’s to a wonderful year ahead!"
};

const totalLetters = 30;
let openedLetters = JSON.parse(localStorage.getItem('openedLetters')) || [];
let currentLetter = 1;

const grid = document.getElementById('lettersGrid');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const messageBody = document.getElementById('messageBody');
const closeBtn = document.getElementById('closeBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function init(){
  grid.innerHTML = '';
  for(let i=1; i<=totalLetters; i++){
    const card = document.createElement('div');
    card.className = `envelope-card ${openedLetters.includes(i) ? 'opened' : ''}`;
    card.innerHTML = `
      <div class="card-num">${i}</div>
      <div class="env-icon">
        <svg viewBox="0 0 24 24">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
        <div class="wax-seal"></div>
      </div>
      <div class="card-label">${openedLetters.includes(i) ? 'Opened' : 'Letter'}</div>
    `;
    card.addEventListener('click', () => openLetter(i));
    grid.appendChild(card);
  }
  updateProgress();
}

function updateProgress(){
  const count = openedLetters.length;
  const percentage = (count / totalLetters) * 100;
  document.getElementById('progressBar').style.width = `${percentage}%`;
  document.getElementById('progressText').textContent = `${count} / ${totalLetters} Opened`;
}

function openLetter(num){
  currentLetter = num;

  // الملاحظات الصغيرة المضافة فوق الرسائل
  const littleNotes = {
    1: "There's something about your smile... ❤️",
    13: "Open me when you miss me. 🤍",
    23: "A little reminder... ❤️",
    30: "The last little piece of my heart. 🎂"
  };

  if(!openedLetters.includes(num)){
    openedLetters.push(num);
    localStorage.setItem('openedLetters', JSON.stringify(openedLetters));
    init();
  }

  modalTitle.textContent = `Letter #${num}`;
  messageBody.innerHTML = messages[num] || "No content found.";

  const oldNote = document.getElementById("littleNote");
  if(oldNote) oldNote.remove();

  if(littleNotes[num]){
    const note = document.createElement("div");
    note.id = "littleNote";
    note.textContent = littleNotes[num];
    note.style.cssText = `
      font-size:13px;
      font-style:italic;
      color:#a27b43;
      margin-bottom:12px;
      letter-spacing:.3px;
    `;
    messageBody.prepend(note);
  }

  updateNavButtons();
  modalOverlay.classList.add('active');
}

function closeModal(){
  modalOverlay.classList.remove('active');
}

function updateNavButtons(){
  prevBtn.disabled = currentLetter <= 1;
  nextBtn.disabled = currentLetter >= totalLetters;
}

closeBtn.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if(e.target === modalOverlay) closeModal();
});

prevBtn.addEventListener('click', () => {
  if(currentLetter > 1) openLetter(currentLetter - 1);
});

nextBtn.addEventListener('click', () => {
  if(currentLetter < totalLetters) openLetter(currentLetter + 1);
});

document.addEventListener('keydown', (e) => {
  if(!modalOverlay.classList.contains('active')) return;
  if(e.key === 'Escape') closeModal();
  if(e.key === 'ArrowLeft' && currentLetter > 1) openLetter(currentLetter - 1);
  if(e.key === 'ArrowRight' && currentLetter < totalLetters) openLetter(currentLetter + 1);
});

init();
</script>

</body>
</html>
